name: Deploy Docs

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'docs/**'
      - 'README.md'
      - '.github/workflows/docs.yml'

  # Build-only on PRs so a broken docs build is caught before merge. The
  # deploy job below is skipped for pull_request events.
  pull_request:
    paths:
      - 'website/**'
      - 'docs/**'
      - 'README.md'
      - '.github/workflows/docs.yml'

  workflow_dispatch:

# Modern GitHub Pages deploy — no gh-pages branch needed. The Pages source
# in repo settings must be set to "GitHub Actions" (Settings → Pages →
# Build and deployment → Source).
permissions:
  contents: read
  pages: write
  id-token: write

# Deploys share one queue and never cancel each other; PR builds get their
# own per-PR group and a newer push to the same PR cancels the stale build.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('docs-pr-{0}', github.event.pull_request.number) || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build Docusaurus
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        run: cd website && npm ci

      - name: Build
        run: cd website && npm run build

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: website/build

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
